<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Carnet de Voyage Digital</title>

    <!-- Typographie éditoriale (titres serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&display=swap" rel="stylesheet" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#faf6f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Japon 2026" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Masque les barres de défilement des rangées d'onglets (utilisé partout). */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Tooltips de la carte en thème sombre (noms de lieux en latin). */
      .leaflet-tooltip.carte-tip {
        background: #0f172a;
        border: 1px solid #1e293b;
        color: #e2e8f0;
        font: 700 11px/1.2 system-ui, sans-serif;
        padding: 3px 8px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        white-space: nowrap;
      }
      .leaflet-tooltip.carte-tip::before { border-top-color: #1e293b; }
    </style>
  </head>
  <body class="bg-[#faf6f0]">
    <div id="root"></div>
  </body>
</html>
